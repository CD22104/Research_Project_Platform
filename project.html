<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --text:#1c2330; --muted:#6b7585;
  --free:#1a9d5b; --free-bg:#e5f6ec; --busy:#c7791a; --busy-bg:#fdf1dc;
  --full:#cf3f3f; --full-bg:#fbe6e6; --accent:#3566d6; --accent-bg:#e8eefb; --track:#e9ecf1;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151b; --card:#1b2029; --line:#2b323e; --text:#e6e9ef; --muted:#8e98a8;
    --free:#4ccb85; --free-bg:#16321f; --busy:#e3a548; --busy-bg:#3a2c12;
    --full:#ef6b6b; --full-bg:#3d1c1c; --accent:#7ba0f5; --accent-bg:#1e2a45; --track:#2a303b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header .back{font-size:13px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
header button{margin-left:auto}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
section>h2{font-size:15px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .meta{font-weight:400;color:var(--muted);font-size:12px}
.pad{padding:12px 14px}
.empty{padding:14px;color:var(--muted)}
.small{color:var(--muted);font-size:12px}
.faint{color:var(--muted);font-size:12px;font-weight:400}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--track);padding:1px 5px;border-radius:4px}
.notice{background:var(--busy-bg);color:var(--busy);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.pill{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.t-run{color:var(--accent);background:var(--accent-bg)}
.t-ok{color:var(--free);background:var(--free-bg)}
.t-bad{color:var(--full);background:var(--full-bg)}
.t-todo{color:var(--busy);background:var(--busy-bg)}
.t-off,.t-other{color:var(--muted);background:var(--track)}
.todo{display:inline-block;color:var(--busy);background:var(--busy-bg);border:1px solid var(--busy);border-radius:6px;
  padding:0 7px;font-size:12px;font-weight:700;white-space:nowrap}
a.todo:hover{text-decoration:none;filter:brightness(1.05)}

/* 1. summary */
.kv{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:5px 0}
.kv>span{color:var(--muted);font-size:13px}
.ups{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.up.lag{color:var(--busy);font-weight:600}
.up.none{color:var(--muted)}

/* markdown */
.md{overflow-wrap:anywhere;min-width:0}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md h3,.md h4,.md h5,.md h6{margin:16px 0 6px;font-size:14px}
.md h3{font-size:15px}
.md p{margin:8px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--track);padding:10px 12px;border-radius:6px;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0}
.md pre code{background:none;padding:0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.md table{border-collapse:collapse;margin:8px 0}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.scroll{overflow-x:auto}

/* 3. path: versions are the trunk, tracks branch off */
.tree{padding-left:22px}
.ver{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--line)}
.ver:last-child{border-left-color:transparent}
.vdot{position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.ver.cur .vdot{background:var(--accent);border-color:var(--accent)}
.vhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vbody>summary{font-size:12px;color:var(--muted);cursor:pointer;margin:2px 0}
.track{margin:8px 0 0;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:8px}
.track.k-run{border-left-color:var(--accent)}
.track.k-ok{border-left-color:var(--free)}
.track.k-bad,.track.k-off{border-left-color:var(--full);border-left-style:dashed}
.thead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tnote{font-size:13px;color:var(--muted);margin:2px 0 4px}
.group{margin:6px 0 14px}
.group>h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 4px}
details.att{border-top:1px dashed var(--line);padding:3px 0}
details.att>summary{cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap;list-style:none}
details.att>summary::before{content:"▸";color:var(--muted);font-size:11px;width:10px}
details.att[open]>summary::before{content:"▾"}
details.att>.md{padding:6px 4px 8px 16px}

/* 4. evidence */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}
table.runs{width:100%;border-collapse:collapse}
table.runs th,table.runs td{padding:7px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.runs th{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
table.runs .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.run{cursor:pointer}
tr.run:hover td{background:var(--bg)}
tr.run.open td{background:var(--accent-bg)}
tr.detail>td{background:var(--bg);padding:12px 14px}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-bottom:8px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin:8px 0}
.chart{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chart figcaption{font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--line)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:1.8;vector-effect:non-scaling-stroke}
.chart .pt{fill:var(--accent)}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.imgs img{max-width:320px;max-height:220px;border:1px solid var(--line);border-radius:6px;background:#fff}
pre.json{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:4px 0 10px}
details.sub{padding:0 14px 12px}
details.sub>summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.sub>.md{padding-top:8px}

/* errors */
table.errs{width:100%;border-collapse:collapse}
table.errs td{padding:6px 14px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <header>
    <a class="back" href="./">← GPU 看板</a>
    <h1 id="title">项目</h1>
    <span class="sub" id="sub">加载中…</span>
    <button id="refresh">刷新</button>
  </header>
  <div id="notice"></div>
  <section id="summary"></section>
  <section id="example"></section>
  <section id="path"></section>
  <section id="evidence"></section>
  <section id="errors" hidden></section>
</main>
<script src="common.js"></script>
<script>
const B = Board, esc = B.esc, $ = id => document.getElementById(id);
const NAME = new URLSearchParams(location.search).get('p') || '';
const ui = {group: null, openRuns: new Set()};  // survives auto-refresh
let data = null;

const TONE = s => ({'进行中': 'run', '并入主线': 'ok', '放弃': 'off', '失败': 'bad', '暂停': 'other'}[s] || 'other');
const byDate = (a, b) => String(a.meta.date || a.meta.started || a.file).localeCompare(String(b.meta.date || b.meta.started || b.file));
const attId = a => 'att-' + a.file;
const attName = a => String(a.meta.id || a.file.split('/').pop().replace(/\.md$/, '')).replace(/^\d{4}-\d{2}-\d{2}-/, '');
const attDate = a => B.day(a.meta.date) || (String(a.meta.id || a.file.split('/').pop()).match(/\d{4}-\d{2}-\d{2}/) || [''])[0];
const fileUrl = rel => '/files/' + encodeURIComponent(NAME) + '/' + rel.split('/').map(encodeURIComponent).join('/');

function notices(d) {
  const out = [], sc = d.scan || {}, now = d.now;
  if (d.stale) out.push(d.scanned_at
    ? `这个项目的数据是 ${B.ago(d.scanned_at, now)}的，最近一次读取失败（${esc(d.stale.error)}）。`
    : `这个项目还没有成功读取过（${esc(d.stale.error)}）。`);
  if (sc.running_since && now - sc.running_since > 5) out.push(`正在扫描共享盘，已 ${B.span(now - sc.running_since)}；下面是上一次的结果。`);
  if (sc.error) out.push(`最近一次扫描失败（${esc(sc.error)}），下面是 ${B.ago(sc.finished, now)}的结果。`);
  return out.map(t => `<div class="notice">${t}</div>`).join('');
}

const runLine = r => {
  const x = r.run || {};
  return `<div>${esc(x.id || r.id)} · ${esc(x.server || '?')}${Array.isArray(x.gpus) && x.gpus.length ? ' 卡 ' + esc(x.gpus.join(',')) : ''}` +
    `${x.tmux ? ` · tmux <code>${esc(x.tmux)}</code>` : ''} ${B.livePill(r.liveness)}</div>`;
};

// 1. one line: question, conclusion, status, version, freshness of each record kind
function summary(d) {
  const p = d.project || {}, u = d.updated || {}, now = d.now;
  const kinds = [['plan', '方案'], ['versions', '版本'], ['tracks', '支线'], ['attempts', '尝试'], ['runs', '运行'], ['examples', '样例']];
  const newest = Math.max(0, ...Object.values(u).filter(t => typeof t === 'number'));
  const ups = kinds.map(([k, label]) => {
    const t = u[k];
    if (typeof t !== 'number') return `<span class="up none">${label}：没有记录</span>`;
    const lag = newest - t > 2 * 86400;  // noticeably older than the latest record
    return `<span class="up${lag ? ' lag' : ''}"${lag ? ` title="比最新的记录早 ${B.span(newest - t)}"` : ''}>${label}：${B.ago(t, now)}</span>`;
  }).join('');
  const active = d.runs.filter(r => (r.run || {}).status === '运行中');
  const todo = d.attempts.filter(a => a.needs_input.some(x => x !== '预期'));
  return `<h2>${B.pill(p.status) || '<span class="faint">未写状态</span>'}
      ${p.current_version ? `<span class="meta">当前版本 <b>${esc(p.current_version)}</b></span>` : ''}
      ${p.updated ? `<span class="meta">· project.json 写于 ${esc(B.when(p.updated))}</span>` : ''}</h2>
    <div class="pad">
      <div class="kv"><span>问题</span><div>${p.question ? esc(p.question) : '<span class="faint">没有写</span>'}</div></div>
      <div class="kv"><span>结论</span><div>${p.conclusion ? esc(p.conclusion) : '<span class="faint">还没有结论</span>'}</div></div>
      ${active.length ? `<div class="kv"><span>运行中</span><div>${active.map(runLine).join('')}</div></div>` : ''}
      ${todo.length ? `<div class="kv"><span>等你处理</span><div>${todo.map(a =>
        `<a class="todo" href="#${esc(attId(a))}" data-open="${esc(attId(a))}">${esc(attName(a))}</a>`).join(' ')}</div></div>` : ''}
      <div class="kv"><span>记录更新</span><div class="ups">${ups}</div></div>
    </div>` +
    (d.plan ? `<details class="sub" id="plan"><summary>整体方案（plan.md，${B.ago(d.plan.mtime, now)}更新）</summary>` +
      `<div class="md">${B.md(d.plan.body) || '<span class="faint">文件是空的</span>'}</div></details>`
     : '<div class="pad faint" style="padding-top:0">还没有 plan.md（整体方案）。</div>');
}

// 2. one worked example
function example(d) {
  const w = d.example && d.example.walkthrough, probe = (d.example && d.example.probe_head) || [];
  return `<h2>一个例子${w ? ` <span class="meta">${esc(w.file)} · ${B.ago(w.mtime, d.now)}更新</span>` : ''}</h2>` +
    (w ? `<div class="md pad">${B.md(w.body) || '<span class="faint">文件是空的</span>'}</div>` +
         (w.truncated ? '<div class="pad faint">文件太长，只显示了前 200 KB。</div>' : '')
       : '<div class="empty">还没有样例（examples/walkthrough.md）。</div>') +
    (probe.length ? `<details class="sub" id="probe"><summary>probe.jsonl 前 ${probe.length} 行</summary>` +
      `<pre class="json">${esc(probe.map(x => JSON.stringify(x)).join('\n'))}</pre></details>` : '');
}

// 3. the path: versions as trunk, tracks branch from from_version, attempts under tracks
function attempt(a) {
  const m = a.meta, ni = a.needs_input || [], flags = [];
  if (ni.includes('结论待确认')) flags.push('<span class="todo">待你确认结论</span>');
  else if (ni.includes('结论和原因')) flags.push('<span class="todo">待你填写结论和原因</span>');
  if (ni.includes('预期')) flags.push('<span class="faint">未写预期</span>');
  const runs = Array.isArray(m.runs) ? m.runs : [];
  return `<details class="att" id="${esc(attId(a))}"><summary>${B.pill(m.status) || '<span class="faint">无状态</span>'}
      <span class="small">${esc(attDate(a))}</span> ${esc(attName(a))} ${flags.join(' ')}
      ${runs.length ? `<span class="small">· 运行 ${runs.map(r => `<a href="#" data-run="${esc(r)}">${esc(r)}</a>`).join(' ')}</span>` : ''}</summary>
    <div class="md">${B.md(a.body) || '<span class="faint">没有正文</span>'}</div></details>`;
}
function track(t, atts) {
  const m = t.meta;
  return `<div class="track k-${TONE(m.status)}">
    <div class="thead">${B.pill(m.status)} <b>${esc(m.title || m.id || t.file)}</b>
      <span class="small">${m.title && m.id ? esc(m.id) + ' · ' : ''}${esc(B.day(m.started))}${m.ended ? ' → ' + esc(B.day(m.ended)) : ''}</span></div>
    ${t.body.trim() ? `<div class="md tnote">${B.md(t.body)}</div>` : ''}
    ${atts.length ? atts.map(attempt).join('') : '<div class="faint">还没有尝试</div>'}</div>`;
}
function path(d) {
  const versions = [...d.versions].sort(byDate), tracks = [...d.tracks].sort(byDate);
  const vids = new Set(versions.map(v => v.meta.id).filter(Boolean));
  const tids = new Set(tracks.map(t => t.meta.id).filter(Boolean));
  const attemptsOf = tid => tid ? d.attempts.filter(a => a.meta.track === tid).sort(byDate) : [];
  const cur = (d.project || {}).current_version;
  let html = '';
  for (const v of versions) {
    const m = v.meta, merged = Array.isArray(m.merged_tracks) ? m.merged_tracks : [];
    html += `<div class="ver${m.id && m.id === cur ? ' cur' : ''}"><span class="vdot"></span>
      <div class="vhead"><b>${esc(m.id || v.file)}</b> ${esc(m.title || '')}
        <span class="small">${esc(B.day(m.date))}${m.parent ? ' · 来自 ' + esc(m.parent) : ''}${merged.length ? ' · 并入 ' + esc(merged.join('、')) : ''}</span>
        ${m.id && m.id === cur ? '<span class="pill t-run">当前版本</span>' : ''}</div>
      ${v.body.trim() ? `<details class="vbody" id="${esc('ver-' + v.file)}"><summary>版本说明</summary><div class="md">${B.md(v.body)}</div></details>` : ''}
      ${tracks.filter(t => m.id && t.meta.from_version === m.id).map(t => track(t, attemptsOf(t.meta.id))).join('')}</div>`;
  }
  const group = (title, inner) => `<div class="group"><h3>${title}</h3>${inner}</div>`;
  const loose = tracks.filter(t => !vids.has(t.meta.from_version));
  if (loose.length) html += group('没有挂到版本上的支线', loose.map(t => track(t, attemptsOf(t.meta.id))).join(''));
  const orphans = d.attempts.filter(a => !tids.has(a.meta.track)).sort(byDate);
  if (orphans.length) html += group('没有归属支线的尝试', `<div class="track">${orphans.map(attempt).join('')}</div>`);
  return `<h2>走过的路 <span class="meta">${versions.length} 个版本 · ${tracks.length} 条支线 · ${d.attempts.length} 次尝试 · 失败和放弃的也在</span></h2>` +
    (html ? `<div class="pad"><div class="tree">${html}</div></div>` : '<div class="empty">还没有版本、支线或尝试的记录。</div>');
}

// 4. evidence: runs table, metric columns grouped by their first-level key
function runDetail(r) {
  const x = r.run || {}, s = r.series, parts = [];
  const facts = [['commit', x.commit], ['续自', x.resumed_from], ['tmux', x.tmux], ['PID', x.pid], ['结束', B.when(x.ended)], ['目录', r.dir]]
    .filter(([, v]) => v != null && v !== '');
  parts.push(`<div class="facts">${facts.map(([k, v]) => `<span><span class="small">${k}</span> ${esc(v)}</span>`).join('')}</div>`);
  if (s && s.keys && s.keys.length) {
    parts.push(`<div class="charts">${s.keys.slice(0, 12).map(k => B.chart(s.points, k)).join('')}</div>` +
      `<div class="small">metrics.jsonl 共 ${s.total} 行${s.downsampled ? `，图上抽样显示 ${s.points.length} 个点` : ''}` +
      `${s.bad_lines ? `，${s.bad_lines} 行无法解析` : ''}${s.keys.length > 12 ? `，只画了前 12 个指标（共 ${s.keys.length} 个）` : ''}</div>`);
  }
  if (r.images.length) parts.push(`<div class="imgs">${r.images.map(p =>
    `<a href="${esc(fileUrl(p))}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(fileUrl(p))}" alt="${esc(p)}" title="${esc(p)}"></a>`).join('')}</div>`);
  for (const [k, v] of [['config', x.config], ['artifacts', x.artifacts], ['metrics（完整）', x.metrics]])
    if (v != null) parts.push(`<div class="small">${k}</div><pre class="json">${esc(JSON.stringify(v, null, 2))}</pre>`);
  if (r.samples_head.length) parts.push(`<div class="small">samples.jsonl 前 ${r.samples_head.length} 行</div>` +
    `<pre class="json">${esc(r.samples_head.map(o => JSON.stringify(o)).join('\n'))}</pre>`);
  return parts.join('');
}
function evidence(d) {
  const key = r => String((r.run || {}).started || '') + ' ' + r.id;
  const runs = [...d.runs].sort((a, b) => key(b).localeCompare(key(a)));  // newest first
  if (!runs.length) return '<h2>证据</h2><div class="empty">还没有运行记录（runs/）。</div>';
  const groups = B.metricGroups(runs.map(r => (r.run || {}).metrics));
  if (!groups.some(g => g.name === ui.group)) ui.group = groups.length ? groups[0].name : null;
  const g = groups.find(x => x.name === ui.group), cols = g ? g.cols : [];
  const label = c => g && g.name ? c.slice(g.name.length + 1) : c;
  const tabs = groups.length > 1 ? `<div class="tabs"><span class="small">指标分组</span>${groups.map(x =>
    `<button class="tab${x.name === ui.group ? ' on' : ''}" data-group="${esc(x.name)}">${esc(x.name || '其他指标')}</button>`).join('')}</div>` : '';
  const rows = runs.map(r => {
    const x = r.run || {}, flat = B.flatten(x.metrics), open = ui.openRuns.has(r.dir);
    return `<tr class="run${open ? ' open' : ''}" data-dir="${esc(r.dir)}">
      <td><b>${esc(x.id || r.id)}</b> <span class="small">${esc(x.kind || '')}</span></td>
      <td>${B.pill(x.status)} ${B.livePill(r.liveness)}</td>
      <td class="small">${esc(x.attempt || '')}</td>
      <td class="small">${esc(x.server || '')}${Array.isArray(x.gpus) && x.gpus.length ? ' 卡 ' + esc(x.gpus.join(',')) : ''}</td>
      <td class="small">${esc(B.when(x.started))}</td>
      ${cols.map(c => `<td class="n">${B.num(flat[c])}</td>`).join('')}</tr>` +
      (open ? `<tr class="detail"><td colspan="${5 + cols.length}">${runDetail(r)}</td></tr>` : '');
  }).join('');
  return `<h2>证据 <span class="meta">${runs.length} 次运行 · 点一行展开详情和曲线</span></h2>${tabs}
    <div class="scroll"><table class="runs"><tr><th>运行</th><th>状态</th><th>尝试</th><th>服务器</th><th>开始</th>` +
    `${cols.map(c => `<th class="n">${esc(label(c))}</th>`).join('')}</tr>${rows}</table></div>`;
}

function errors(d) {
  return `<h2>读取有问题的文件 <span class="meta">${d.errors.length} 个 · 修好后下一次扫描（约 1 分钟）就会消失</span></h2>
    <table class="errs">${d.errors.map(e => `<tr><td><code>${esc(e.file)}</code></td><td class="small">${esc(e.error)}</td></tr>`).join('')}</table>`;
}

function render(d) {
  const p = d.project || {};
  document.title = (p.title || d.name) + ' · 项目';
  $('title').textContent = p.title || d.name;
  $('notice').innerHTML = notices(d);
  $('summary').innerHTML = summary(d);
  $('example').innerHTML = example(d);
  $('path').innerHTML = path(d);
  $('evidence').innerHTML = evidence(d);
  $('errors').hidden = !d.errors.length;
  $('errors').innerHTML = d.errors.length ? errors(d) : '';
  $('sub').textContent = `数据读取于 ${B.ago(d.scanned_at, d.now)} · 每分钟自动刷新`;
}

async function load() {
  if (!NAME) { $('sub').textContent = '地址里缺少项目名（project.html?p=名字）'; return; }
  const open = [...document.querySelectorAll('details[open][id]')].map(x => x.id);  // keep what the user expanded
  let r;
  try { r = await fetch('/api/project/' + encodeURIComponent(NAME)); }
  catch (e) { $('sub').textContent = '连不上看板'; return; }
  if (r.status === 404) {
    $('title').textContent = NAME;
    $('sub').textContent = '没有这个项目（或者它的 board/project.json 还没写好）';
    for (const id of ['summary', 'example', 'path', 'evidence']) $(id).innerHTML = '';
    return;
  }
  data = await r.json();
  render(data);
  for (const id of open) { const el = document.getElementById(id); if (el) el.open = true; }
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-group]');
  if (tab) { ui.group = tab.dataset.group; $('evidence').innerHTML = evidence(data); return; }
  const row = e.target.closest('tr.run');
  if (row && !e.target.closest('a')) {
    const dir = row.dataset.dir;
    ui.openRuns.has(dir) ? ui.openRuns.delete(dir) : ui.openRuns.add(dir);
    $('evidence').innerHTML = evidence(data);
    return;
  }
  const op = e.target.closest('[data-open]');
  if (op) { const el = document.getElementById(op.dataset.open); if (el) el.open = true; return; }
  const rl = e.target.closest('[data-run]');
  if (rl) {  // jump from an attempt to its run in the evidence table
    e.preventDefault();
    const r = data.runs.find(x => ((x.run || {}).id || x.id) === rl.dataset.run);
    if (!r) return;
    ui.openRuns.add(r.dir);
    $('evidence').innerHTML = evidence(data);
    const tr = [...document.querySelectorAll('tr.run')].find(t => t.dataset.dir === r.dir);
    if (tr) tr.scrollIntoView({behavior: 'smooth', block: 'start'});
  }
});
$('refresh').onclick = load;
load();
setInterval(load, 60000);
</script>
</body>
</html>
