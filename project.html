<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CD的研究控制台</title>
<!-- Old address of a project page: project.html?p=<name> (or ?name=). Forwards to the console's project route. -->
<script>
const q = new URLSearchParams(location.search), name = q.get('p') || q.get('name');
location.replace('./' + (name ? '#/p/' + encodeURIComponent(name) + '/overview' : '#/overview'));
</script>
</head>
<body><p><a href="./">打开控制台</a></p></body>
</html>
