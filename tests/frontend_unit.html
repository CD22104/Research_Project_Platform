<!doctype html>
<meta charset="utf-8">
<title>common.js unit tests</title>
<!-- Run by tests/test_frontend.py in headless Chromium; results land in #result as JSON. -->
<div id="sandbox"></div>
<pre id="result">not run</pre>
<script src="../platform/common.js"></script>
<script>
const results = [];
function check(name, cond, detail) { results.push({name, ok: !!cond, detail: cond ? '' : String(detail ?? '')}); }
const B = Board;

// Markdown must never produce live markup from source text
const evil = [
  '<script>window.__pwned = 1<\/script>',
  '<img src=x onerror="window.__pwned=1">',
  '[click](javascript:window.__pwned=1)',
  '[x](JaVaScRiPt:alert(1))',
  '[x](data:text/html,<script>alert(1)<\/script>)',
  '**<b onmouseover=alert(1)>bold</b>**',
  '`<script>alert(1)<\/script>`',
  '```\n<script>window.__pwned=1<\/script>\n```',
  '| a | <i onclick=x> |\n|---|---|\n| <svg onload=alert(1)> | 2 |',
  '- <iframe src=javascript:alert(1)>',
  '> <script>window.__pwned=1<\/script>',
  '[ok](https://example.org/a?b=1&c="2")',
].join('\n\n');
const sb = document.getElementById('sandbox');
sb.innerHTML = B.md(evil);
check('no script elements from markdown', sb.querySelectorAll('script,iframe,img,svg,i,b[onmouseover]').length === 0, sb.innerHTML);
check('no event-handler attributes', [...sb.querySelectorAll('*')].every(e => [...e.attributes].every(a => !/^on/i.test(a.name))), sb.innerHTML);
const hrefs = [...sb.querySelectorAll('a')].map(a => a.getAttribute('href'));
check('only http(s) links', hrefs.length === 1 && hrefs[0] === 'https://example.org/a?b=1&c="2"', JSON.stringify(hrefs));
check('links open safely', sb.querySelector('a').rel === 'noopener noreferrer');
check('script text shown as text', sb.textContent.includes('<script>window.__pwned = 1<\/script>'), sb.textContent);
check('nothing executed', window.__pwned === undefined);

// Markdown structure
const doc = B.md('# T\n\n段落第一行\n第二行 **粗** `code`\n\n- a\n- b\n\n1. x\n2. y\n\n| h1 | h2 |\n|---|---|\n| 1 | 2 |\n\n```py\nif a < b:\n    pass\n```\n\n  # indented hash is text\n\n> quote');
sb.innerHTML = doc;
check('heading shifted to h3', sb.querySelector('h3')?.textContent === 'T', doc);
check('bold and code', sb.querySelector('p strong')?.textContent === '粗' && sb.querySelector('p code')?.textContent === 'code', doc);
check('lists', sb.querySelectorAll('ul li').length === 2 && sb.querySelectorAll('ol li').length === 2, doc);
check('table', sb.querySelectorAll('table tr').length === 2 && sb.querySelector('th').textContent === 'h1', doc);
check('code block keeps text', sb.querySelector('pre code')?.textContent === 'if a < b:\n    pass', doc);
check('indented hash is a paragraph', [...sb.querySelectorAll('p')].some(p => p.textContent.includes('# indented')), doc);
check('blockquote', sb.querySelector('blockquote p')?.textContent === 'quote', doc);
check('unclosed fence does not hang', B.md('```\nno end').includes('no end'));

// nested lists: an item owns the deeper lines under it (sub-lists, continuation lines); numbering keeps its start
const nest = B.md('1. **写规范**：\n   - allow 的定义；\n   - 证据：\n   统一政策参照 JAB。\n2. **取数据**：\n   - AuthGateBench\n\n### 第二段\n8. 读回标注：\n   - 一致性\n9. 整理');
sb.innerHTML = nest;
const tops = [...sb.children].filter(x => x.tagName === 'OL');
check('nested: two top-level lists, split by the heading', tops.length === 2, nest);
check('nested: sub-items stay under their item', tops[0].children.length === 2 && tops[0].children[0].querySelectorAll(':scope > ul > li').length === 2
  && tops[0].children[1].querySelectorAll(':scope > ul > li').length === 1, nest);
check('nested: a lazy line continues the item above', tops[0].children[0].querySelectorAll('ul > li')[1].textContent.includes('统一政策参照 JAB'), nest);
check('nested: the first item text keeps inline markup', tops[0].children[0].querySelector(':scope > strong')?.textContent === '写规范', nest);
check('ordered list keeps its first number', tops[1].getAttribute('start') === '8' && tops[1].children.length === 2 && tops[0].getAttribute('start') === null, nest);
sb.innerHTML = B.md('1. a\n\n2. b\n\n- c\n1. d\n- e\n  more\nafter');
check('blank lines between items keep one list; a new kind starts a new list', sb.querySelectorAll('ol').length === 2 && sb.querySelector('ol').children.length === 2
  && sb.querySelectorAll('ul').length === 2, sb.innerHTML);
check('indented continuation joins the item', [...sb.querySelectorAll('ul li')].some(li => li.textContent === 'e\nmore' || li.textContent === 'e more'), sb.innerHTML);
check('deep nesting does not hang', B.md(Array.from({length: 60}, (_, k) => ' '.repeat(k * 2) + '- x' + k).join('\n')).includes('x59'));
sb.innerHTML = B.md('- ok\n   - <img src=x onerror="window.__pwned=1">\n     <script>window.__pwned=1<\/script>');
check('nested items are escaped too', sb.querySelectorAll('img,script').length === 0 && window.__pwned === undefined, sb.innerHTML);
check('empty input', B.md('') === '' && B.md(null) === '');

// ---- the runs page: which settings become columns, sorting, the cross table, cell shading
const J = x => JSON.stringify(x);
const cfgs = [
  {model: 'haiku', strategy: 'direct', condition: 'a', bench: 'ag', n: 200, policy: 'x'.repeat(50), net: {layers: 6}, ledger: 1.1, extra: 1},
  {model: 'haiku', strategy: 'decompose', condition: 'b', bench: 'ag', n: 200, policy: 'x'.repeat(50), net: {layers: 12}, ledger: 1.2},
  {model: 'sonnet', strategy: 'direct', condition: 'c', bench: 'ag', n: 80, policy: 'y'.repeat(50), net: {layers: 6}, ledger: 1.3},
  {model: 'sonnet', strategy: 'decompose', condition: 'a', bench: 'ag', n: 200, policy: 'x'.repeat(50), net: {layers: 6}, ledger: 1.4},
  null];
const sc = B.settingColumns(cfgs.slice(0, 4));
check('settings: varying keys in record order; one in every run differs (ledger) or few runs have (extra) are left out',
  J(sc.cols) === J(['model', 'strategy', 'condition', 'n', 'net.layers']), J(sc));
check('settings: constant short values are common; long values are neither', J(sc.common) === J([['bench', 'ag']]), J(sc));
check('settings: a run without config makes keys vary', B.settingColumns(cfgs).common.length === 0, J(B.settingColumns(cfgs)));
check('settings: display.settings wins, unknown keys dropped', J(B.settingColumns(cfgs.slice(0, 4), {prefer: ['condition', 'nope', 'model']}).cols) === J(['condition', 'model']));
check('display.settings is read', J(B.parseDisplay({settings: ['model']}).settings) === J(['model']) && B.parseDisplay({settings: 'model'}).problems.length === 1);
check('settings: max keeps the first ones', J(B.settingColumns(cfgs.slice(0, 4), {max: 2}).cols) === J(['model', 'strategy']));
check('settings: a few long values do not hide a column', J(B.settingColumns([{c: 'a'}, {c: 'b'}, {c: 'x'.repeat(60)}]).cols) === J(['c']));
check('settings: two runs differing in one key show it', J(B.settingColumns([{lr: 1}, {lr: 2}]).cols) === J(['lr']));
check('settings: nothing to show', J(B.settingColumns([])) === J({cols: [], common: []}));

const rows = [{id: 1, v: 10}, {id: 2, v: 2}, {id: 3, v: null}, {id: 4, v: 2}, {id: 5}];
check('sort: numbers by value, missing last, ties keep their order', J(B.sortRows(rows, r => r.v, false).map(r => r.id)) === J([2, 4, 1, 3, 5]));
check('sort: descending keeps missing last', J(B.sortRows(rows, r => r.v, true).map(r => r.id)) === J([1, 2, 4, 3, 5]));
check('sort: text in natural order', J(B.sortRows(['filler20', 'filler5', 'action_only'], x => x, false)) === J(['action_only', 'filler5', 'filler20']));
check('sort: does not change its input', rows[0].id === 1);

const pv = B.pivot([{r: 'a', c: 'x', v: 1}, {r: 'a', c: 'x', v: 3}, {r: 'b', c: 'y', v: 5}, {r: 'a', c: 'y', v: 2, dim: 1}, {r: 'a', c: 'y', v: 4, dim: 1},
  {r: 'b', c: 'x', v: 9, dim: 1}, {r: 'b', c: 'x', v: 7}, {r: 'c', c: 'x', v: null}, {r: 'a', c: 'z', v: 0}], x => x.r, x => x.c, x => x.v, x => x.dim);
check('pivot: rows and columns in order of first appearance, items without a value left out', J(pv.rows) === J(['a', 'b']) && J(pv.cols) === J(['x', 'y', 'z']), J([pv.rows, pv.cols]));
const cl = (r, c) => { const x = pv.cell(r, c); return x && [x.mean, x.n, x.dim, x.items.length]; };
check('pivot: two runs in a cell are averaged', J(cl('a', 'x')) === J([2, 2, false, 2]));
check('pivot: spot checks stay out of the mean unless the cell has nothing else', J(cl('b', 'x')) === J([7, 1, false, 2]) && J(cl('a', 'y')) === J([3, 2, true, 2]));
check('pivot: an empty cell is null', pv.cell('b', 'z') === null);
check('pivot: two settings as one column', J(B.pivot([{v: 1}], () => 'r', () => ['direct', 'haiku'], x => x.v).cols) === J([['direct', 'haiku']]));

const s1 = B.scale([0.2, 0.5, 0.1], 'lower');
check('scale: lower is better marks the smallest', s1.best(0.1) && !s1.best(0.5) && !s1.best(0.2));
check('scale: bars start at zero', s1.pos(0.5) === 1 && Math.abs(s1.pos(0.1) - 0.2) < 1e-9);
check('scale: goodness follows the direction', s1.good(0.1) === 1 && s1.good(0.5) === 0);
const s2 = B.scale([3], 'higher'), s3 = B.scale([1, 2], null);
check('scale: one value, no division by zero, no best', s2.pos(3) === 1 && !s2.best(3) && s2.good(3) === null);
check('scale: no direction, no best and no goodness', !s3.best(2) && s3.good(2) === null && s3.pos(1) === 0.5);
check('scale: missing values', s1.pos(null) === 0 && !s1.best(undefined));

// esc / num / time
check('esc', B.esc('<a href="x">\'&') === '&lt;a href=&quot;x&quot;&gt;&#39;&amp;');
check('num: 4 decimals, integers as is', B.num(0.81) === '0.8100' && B.num(0.59966777) === '0.5997' && B.num(1234) === '1234' && B.num(1e-5) === '1.00e-5' && B.num(2.5e6) === '2500000' && B.num(2500000.5) === '2.50e+6' && B.num(0) === '0' && B.num(null) === '' && B.num('<x>') === '&lt;x&gt;', [B.num(0.81), B.num(1e-5), B.num(2.5e6)]);
check('short for axes', B.short(0.123456) === '0.1235' && B.short(250000) === '2.5e+5');
check('ago', B.ago(100, 160) === '60 秒前' && B.ago(null) === '—');
check('when invalid passes through', B.when('not a date') === 'not a date');
check('pill escapes unknown status', B.pill('<x>') === '<span class="pill t-other">&lt;x&gt;</span>');

// metrics
check('flatten', JSON.stringify(B.flatten({'测试集': {acc: 0.8, sub: {f1: 0.7}}, loss: 1})) === JSON.stringify({'测试集.acc': 0.8, '测试集.sub.f1': 0.7, loss: 1}));
const groups = B.metricGroups([{'测试集': {acc: 0.81, f1: 0.77}, train_loss: 0.31}, {'测试集': {acc: 0.8}, '少数类召回': 0.55, '对照': {acc: 0.5}}, {'对照': {note: 'text only'}}, null, 'bad']);
check('metric groups with run counts', JSON.stringify(groups) === JSON.stringify([
  {name: '测试集', cols: ['acc', 'f1'], runs: 2}, {name: '', cols: ['train_loss', '少数类召回'], runs: 2}, {name: '对照', cols: ['acc', 'note'], runs: 1}]), JSON.stringify(groups));
check('groupValues', JSON.stringify(B.groupValues({'测试集': {acc: 1, sub: {f1: 2}}, x: 3}, '测试集')) === JSON.stringify({acc: 1, 'sub.f1': 2})
  && JSON.stringify(B.groupValues({'测试集': {acc: 1}, x: 3}, '')) === JSON.stringify({x: 3}) && JSON.stringify(B.groupValues(null, 'a')) === '{}');

// display preferences
const dp = B.parseDisplay({default_group: 'g', group_order: ['a', 'b'], primary_metrics: ['acc'], ratio: {acc: ['correct', 'n'], bad: ['x']}, colour: 'red'});
check('parseDisplay keeps valid fields', dp.defaultGroup === 'g' && dp.order.join() === 'a,b' && dp.primary.join() === 'acc' && JSON.stringify(dp.ratio) === JSON.stringify({acc: ['correct', 'n']}), JSON.stringify(dp));
check('parseDisplay reports problems', dp.problems.length === 2 && dp.problems.some(p => p.includes('colour')) && dp.problems.some(p => p.includes('ratio.bad')), JSON.stringify(dp.problems));
check('parseDisplay wrong types', B.parseDisplay({default_group: 3, group_order: 'a', primary_metrics: [1]}).problems.length === 3 && B.parseDisplay('x').problems.length === 1 && B.parseDisplay(undefined).problems.length === 0);
const gs = [{name: 'a', runs: 2}, {name: 'b', runs: 5}, {name: '', runs: 5}, {name: 'c', runs: 5}];
let ag = B.arrangeGroups(gs, null);
check('arrange: by run count, named before scalars', ag.ordered.map(g => g.name).join() === 'b,c,,a' && ag.defaultName === 'b', JSON.stringify(ag));
ag = B.arrangeGroups(gs, B.parseDisplay({group_order: ['a', 'c']}));
check('arrange: group_order first', ag.ordered.map(g => g.name).join() === 'a,c,b,' && ag.defaultName === 'c', JSON.stringify(ag));
ag = B.arrangeGroups(gs, B.parseDisplay({default_group: 'a'}));
check('arrange: default_group wins', ag.defaultName === 'a' && ag.missingDefault === null);
ag = B.arrangeGroups(gs, B.parseDisplay({default_group: 'zz'}));
check('arrange: missing default_group reported', ag.defaultName === 'b' && ag.missingDefault === 'zz');

// walkthrough split, rules, gists, statuses
let sp = B.splitFull('short\n\n---\n\n# 完整原文\nfull');
check('splitFull at --- before 完整原文', sp && sp.head === 'short\n' && sp.full.startsWith('---'), JSON.stringify(sp));
sp = B.splitFull('a\n---\nnot full\n## 完整原文\nx');
check('splitFull falls back to the heading', sp && sp.head === 'a\n---\nnot full' && sp.full.startsWith('## 完整原文'), JSON.stringify(sp));
check('splitFull without marker', B.splitFull('just text\n---\nmore') === null && B.splitFull('# 完整原文\nall') === null);
check('horizontal rules', B.md('a\n\n---\n\nb').includes('<hr>') && B.md('* * *').includes('<hr>') && !B.md('* * *').includes('<li>'));
check('firstSentence', B.firstSentence('x\n## 假设\n假设：第一句。第二句。\n## 现状\ny', '假设') === '第一句。'
  && B.firstSentence('## 现状\ny', '假设') === '' && B.firstSentence('## 假设\n' + '长'.repeat(100), '假设', 10) === '长'.repeat(10) + '…');
check('statuses', B.tone('部分成功') === 'part' && B.tone('搁置中') === 'other' && B.pill('部分成功').includes('t-part') && B.tone('成功') !== B.tone('部分成功') && B.tone('失败') !== B.tone('部分成功'));

// chart
const svg = B.chart([{step: 0, loss: 2}, {step: 10, loss: 1}, {step: 20, loss: '<x>'}], 'loss');
check('chart has a path', svg.includes('<path class="ln"') && svg.includes('loss'), svg);
check('chart ignores bad points', B.chart([{step: 0, loss: 'x'}], 'loss') === '');
check('chart escapes key', !B.chart([{step: 0, '<k>': 1}], '<k>').includes('<k>'));

// free cards
{
  const md = (id, extra) => ({meta: Object.assign({id}, extra), file: 'x/' + id + '.md'});
  const L = B.flowLayout({
    versions: [md('v1', {date: '2026-11-11', parent: null, merged_tracks: ['base', 'ft']}), md('v2', {date: '2026-11-25', parent: 'v1', merged_tracks: []})],
    tracks: [md('base', {status: '并入主线'}), md('ft', {status: '并入主线'}), md('harness', {status: '进行中', from_version: 'v1'}), md('dead', {status: '放弃', from_version: 'v1'})],
    attempts: [md('2026-11-10-a', {track: 'base', date: '2026-11-10', status: '成功'}), md('2026-11-11-b', {track: 'ft', date: '2026-11-11', status: '失败'}),
               md('2026-11-12-c', {track: 'base', date: '2026-11-12', status: '成功'}),
               md('2026-11-20-d', {track: 'harness', date: '2026-11-20', status: '进行中', after: ['2026-11-11-b']}),
               md('2026-11-21-e', {track: 'dead', date: '2026-11-21', status: '放弃'}), md('plan-f', {track: 'harness', status: '计划中'}),
               md('2026-11-13-g', {track: 'nope', date: '2026-11-13', status: '成功'})]});
  const row = k => L.nodes.find(n => n.key === k).row, lane = k => L.nodes.find(n => n.key === k).lane;
  check('flowLayout: merged attempts above their version, forks below it',
    row('a:2026-11-12-c') < row('v:v1') && row('a:2026-11-11-b') < row('v:v1') && row('v:v1') < row('t:harness') && row('t:harness') < row('a:2026-11-20-d'));
  check('flowLayout: versions on the main line, tracks on their own lanes', lane('v:v1') === 0 && lane('v:v2') === 0 && lane('start') === 0
    && lane('a:2026-11-10-a') === lane('a:2026-11-12-c') && lane('a:2026-11-10-a') !== lane('a:2026-11-11-b') && lane('a:2026-11-10-a') > 0);
  check('flowLayout: a lane freed by a merge is reused', [lane('t:harness'), lane('t:dead')].includes(lane('t:base')) || [lane('t:harness'), lane('t:dead')].includes(lane('t:ft')));
  check('flowLayout: planned attempts last in their lane; after links across lanes', row('a:plan-f') > row('a:2026-11-20-d')
    && L.edges.some(e => e.kind === 'after' && e.from === 'a:2026-11-11-b' && e.to === 'a:2026-11-20-d')
    && L.edges.some(e => e.kind === 'merge' && e.from === 'a:2026-11-12-c' && e.to === 'v:v1'));
  check('flowLayout: attempts of unknown tracks get a lane; every node has a row', lane('a:2026-11-13-g') > 0 && new Set(L.nodes.map(n => n.row)).size === L.nodes.length);
  const C = B.flowLayout({versions: [md('v1', {parent: 'v2'}), md('v2', {parent: 'v1'})], tracks: [], attempts: []});
  check('flowLayout: a cycle in the records still lays out every node', C.nodes.length === 3);
}
check('sortServers: h200, h100, a100, then 6k', B.sortServers([{name: 'xtraa6k04'}, {name: 'xtraa100'}, {name: 'xtraa6k01'}, {name: 'xtrah100'}, {name: 'xtrah200'}])
  .map(s => s.name).join() === 'xtrah200,xtrah100,xtraa100,xtraa6k01,xtraa6k04');
check('isFree / freeCount', B.isFree({procs: [], mem_used: 100}) && !B.isFree({procs: [{pid: 1}], mem_used: 0}) && !B.isFree({procs: [], mem_used: 600})
  && B.freeCount({servers: [{status: 'ok', gpus: [{procs: [], mem_used: 0}, {procs: [], mem_used: 9000}]}, {status: 'error', gpus: [{procs: [], mem_used: 0}]}]}) === 1
  && B.freeCount(null) === 0);

// objects as key/value tables, never a one-line dict
sb.innerHTML = B.kvTable({lr: 0.001, model: {layers: 6, name: '<b>x</b>'}, tags: ['a', 'b'], none: null});
const kvRows = [...sb.querySelectorAll('table.kv tr')].map(tr => [tr.querySelector('th').textContent, tr.querySelector('td').textContent]);
check('kvTable rows', JSON.stringify(kvRows) === JSON.stringify([['lr', '0.0010'], ['model.layers', '6'], ['model.name', '<b>x</b>'], ['tags', 'a、b'], ['none', 'null']]), JSON.stringify(kvRows));
check('kvTable escapes and aligns numbers', !sb.querySelector('table.kv b') && sb.querySelectorAll('table.kv td.num').length === 2);
check('kvTable empty / scalar', B.kvTable({}).includes('（空）') && B.kvTable('<s>') === '<span>&lt;s&gt;</span>');

// headline and the best run
check('headline parsed', JSON.stringify(B.parseDisplay({headline: {group: 'g', metric: 'acc', better: 'lower'}}).headline) === JSON.stringify({group: 'g', metric: 'acc', better: 'lower'})
  && B.parseDisplay({headline: {group: 'g', metric: 'acc', better: 'up'}}).problems.length === 1);
const runsB = [
  {id: 'a', run: {kind: 'eval', metrics: {g: {acc: 0.7, n: 10, of: 10}}}},
  {id: 'b', run: {kind: 'eval', metrics: {g: {acc: 0.9, n: 5, of: 10}}}},    // spot check: n < of
  {id: 'c', run: {kind: 'data', metrics: {g: {acc: 0.99}}}},
  {id: 'd', run: {kind: 'smoke', metrics: {g: {acc: 0.98}}}},
  {id: 'e', run: {kind: 'train', metrics: {g: {acc: 0.8}}}},
  {id: 'f', run: {kind: 'eval', metrics: {h: {acc: 1}}}}];
check('bestRun higher, skipping spot checks, data and smoke', B.bestRun(runsB, {group: 'g', metric: 'acc', better: 'higher'}).run.id === 'e');
check('bestRun lower', B.bestRun(runsB, {group: 'g', metric: 'acc', better: 'lower'}).run.id === 'a');
check('bestRun none', B.bestRun(runsB, null) === null && B.bestRun(runsB, {group: 'zz', metric: 'acc', better: 'higher'}) === null);

// recent activity
const evd = {plan: {mtime: 100}, versions: [{meta: {id: 'v1', date: '1970-01-01T00:03:20Z'}, file: 'versions/v1.md', mtime: 5}],
  tracks: [{meta: {id: 't', title: 'T', started: '1970-01-01T00:01:40Z', ended: '1970-01-01T00:05:00Z', status: '放弃'}, file: 'tracks/t.md'}],
  attempts: [{meta: {id: 'x', status: '成功'}, file: 'attempts/x.md', mtime: 400}, {meta: {}, file: 'attempts/y.md', mtime: 390}],
  runs: [{id: 'r1', run: {started: '1970-01-01T00:06:40Z', ended: '1970-01-01T00:07:00Z', status: '完成', server: 's', gpus: [1]}}, {id: 'r2', run: {}, mtime: 50}]};
const evs = B.events(evd);
check('events sorted newest first', evs.map(e => e.t).join() === '420,400,400,390,300,200,100,100,50', evs.map(e => e.t).join());
check('events text and targets', evs[0].text === '运行 r1 结束：完成' && evs[0].tab === 'runs' && evs.some(e => e.text === '运行 r1 开始（s 卡 1）')
  && evs.some(e => e.text === '支线「T」结束（放弃）') && evs.some(e => e.text === '尝试「y」' && e.item === 'y'), JSON.stringify(evs));
const folded = B.foldEvents([{t: 1000, kind: 'run', text: 'r'}, {t: 900, kind: 'attempt', text: 'a1', item: 'a1'}, {t: 800, kind: 'attempt', text: 'a2'},
  {t: 500, kind: 'attempt', text: 'a3'}, {t: -200, kind: 'attempt', text: 'a4', item: 'a4'}]);
check('foldEvents', folded.map(e => e.text).join('|') === 'r|3 条尝试记录有更新|a4' && folded[1].item === null, JSON.stringify(folded));

// markdown tables: numeric columns right-aligned
sb.innerHTML = B.md('| 测试集 | 准确率 | 备注 |\n|---|---|---|\n| 同分布 | 588/602 (0.977) | ok |\n| 换措辞 | 541/601 (0.900) | 12 |');
check('md table numeric columns', [...sb.querySelectorAll('tbody tr:first-child td')].map(td => td.className).join() === ',num,' && sb.querySelector('thead th.num').textContent === '准确率');
check('projectUrl', B.projectUrl('a b') === '#/p/a%20b/overview' && B.projectUrl('x', 'runs', 'r/1') === '#/p/x/runs/r%2F1');

// setup.json lookups and the roadmap tree
const si = B.setupIndex({goal: 'g', datasets: [{id: 'a', name: 'A'}, {name: 'no id'}], metrics: [{id: 'acc'}], methods: [{id: 'm', name: 'M', runs: ['r1', 'r2']}, {id: 'n', runs: ['r1']}]});
check('setupIndex', si.present && si.goal === 'g' && si.datasets.size === 1 && si.metrics.has('acc') && si.runMethod.get('r2').id === 'm' && si.runMethod.get('r1').id === 'm');
check('setupIndex without setup', !B.setupIndex(null).present && B.setupIndex(null).datasets.size === 0 && B.setupIndex({datasets: 'x'}).datasets.size === 0);
const rt = B.roadmapTree({
  versions: [{meta: {id: 'v2', date: '2026-02-01', merged_tracks: []}, file: 'v2'}, {meta: {id: 'v1', date: '2026-01-01', merged_tracks: ['m']}, file: 'v1'}],
  tracks: [{meta: {id: 'b', from_version: 'v2', started: '2026-02-02'}, file: 'b'}, {meta: {id: 'm', from_version: null, started: '2025-12-01'}, file: 'm'},
           {meta: {id: 'x', from_version: 'v9'}, file: 'x'}, {meta: {id: 'a', from_version: 'v1', started: '2026-01-05'}, file: 'a'}],
  attempts: [{meta: {id: 'a2', track: 'a', date: '2026-01-09'}, file: 'a2'}, {meta: {id: 'a1', track: 'a', date: '2026-01-06'}, file: 'a1'}, {meta: {id: 'o', track: 'zz'}, file: 'o'}]});
check('roadmapTree', rt.versions.map(v => v.version.meta.id + ':' + v.tracks.map(n => n.track.meta.id + (n.merged ? '>' + n.merged : '')).join(',')).join(' ') === 'v1:m>v1,a v2:b'
  && rt.versions[0].tracks[1].attempts.map(a => a.meta.id).join() === 'a1,a2' && rt.loose.map(n => n.track.meta.id).join() === 'x' && rt.orphans.map(a => a.meta.id).join() === 'o',
  JSON.stringify(rt.versions.map(v => [v.version.meta.id, v.tracks.map(n => n.track.meta.id)])));

// GPU card <-> run matching
const runs = [{server: 'h200', gpus: [2, 3], pid: 999, id: 'a'}, {server: 'h200', gpus: ['5'], pid: '77', id: 'b'}, {server: 'a100', gpus: [2], id: 'c'}];
const ids = (srv, g) => B.runsOnGpu(runs, srv, g).map(r => r.id).join();
check('match by listed gpu', ids('h200', {index: 2, procs: []}) === 'a');
check('match by pid on another gpu', ids('h200', {index: 0, procs: [{pid: 77}]}) === 'b');
check('string gpu ids', ids('h200', {index: 5, procs: []}) === 'b');
check('server must match', ids('xx', {index: 2, procs: []}) === '');
check('no match', ids('h200', {index: 7, procs: [{pid: 1}]}) === '');

document.getElementById('result').textContent = JSON.stringify(results);
