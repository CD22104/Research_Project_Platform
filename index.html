<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD的研究控制台</title>
<style>
:root{
  /* green theme: deep green for the interface, bright green for "free / success", warm grey-greens for neutrals */
  --bg:#f3f6f3; --card:#fff; --line:#dfe6e0; --text:#1b2620; --muted:#64736a; --side:#f8faf8;
  --free:#2a9d4b; --free-bg:#e3f4e6; --busy:#c47a17; --busy-bg:#fbf0dc;
  --full:#cc3f3f; --full-bg:#fae6e4; --accent:#11695a; --accent-bg:#e0efe9; --track:#e6ebe6;
  --part:#857a12; --part-bg:#f3efd2; --hover:#edf2ee; --bar:#8db9a6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101512; --card:#18201b; --line:#29332c; --text:#e3ebe5; --muted:#8c9a91; --side:#141a16;
    --free:#5acb7c; --free-bg:#16311f; --busy:#e3a548; --busy-bg:#3a2c12;
    --full:#ef6b6b; --full-bg:#3d1c1c; --accent:#4fbf9f; --accent-bg:#15302a; --track:#252e28;
    --part:#cdbd4c; --part-bg:#33301a; --hover:#1f2822; --bar:#4d7a68;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none !important}
button{font:inherit;padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
select{font:inherit;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--track);padding:1px 5px;border-radius:4px}
.small{color:var(--muted);font-size:12px}
.faint{color:var(--muted);font-size:12px;font-weight:400}
.empty{padding:16px;color:var(--muted)}
.scroll{overflow-x:auto}

/* ---------- shell: fixed sidebar + main */
.app{display:flex;min-height:100vh}
.side{width:212px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);
  border-right:1px solid var(--line);padding:14px 10px 20px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:15px;padding:2px 10px 12px;color:var(--text);text-decoration:none}
.brand:hover{text-decoration:none}
.sitem{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--text);text-decoration:none;font-size:14px;min-width:0}
.sitem:hover{background:var(--hover);text-decoration:none}
.sitem.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sitem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .cnt{font-size:12px;color:var(--muted);background:var(--track);border-radius:99px;padding:0 7px;white-space:nowrap}
.sitem.on .cnt{background:var(--card)}
.shead{font-size:12px;color:var(--muted);padding:14px 10px 4px;font-weight:600}
.sitem.new{margin-top:auto;color:var(--muted)}
.sitem[title]{align-items:flex-start}
.sitem[title] .dot{margin-top:7px}
.sitem[title] .lbl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
details.sarch>summary{cursor:pointer;list-style-position:inside}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--muted)}
.d-run{background:var(--accent)} .d-ok{background:var(--free)} .d-part{background:var(--part)}
.d-bad{background:var(--full)} .d-todo{background:var(--busy)} .d-off,.d-other{background:var(--muted)}
.main{flex:1;min-width:0;padding:18px 24px 48px}
.page{max-width:1240px}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;overflow-x:auto;
    padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .brand{padding:0 8px 0 4px;white-space:nowrap}
  .shead{display:none}
  .sitem{flex:none;padding:5px 9px}
  .sitem .lbl{max-width:9em}
  .sitem[title] .lbl{display:block;white-space:nowrap}
  .sitem[title] .dot{margin-top:0}
  .sitem[title]{align-items:center}
  details.sarch{display:flex;align-items:center;flex:none}
  details.sarch>summary.shead{display:list-item;padding:5px 9px}
  .sitem.new{margin-top:0}
  .main{padding:14px 12px 40px}
}

/* ---------- common blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.card>h2{font-size:15px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .meta{font-weight:400;color:var(--muted);font-size:12px}
h2 .right{margin-left:auto}
.pad{padding:12px 14px}
.notice{background:var(--busy-bg);color:var(--busy);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.pill{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.t-run{color:var(--accent);background:var(--accent-bg)}
.t-ok{color:var(--free);background:var(--free-bg)}
.t-bad{color:var(--full);background:var(--full-bg)}
.t-todo{color:var(--busy);background:var(--busy-bg)}
.t-part{color:var(--part);background:var(--part-bg);box-shadow:inset 0 0 0 1px var(--part)}
.t-off,.t-other{color:var(--muted);background:var(--track)}
.todo{display:inline-block;color:var(--busy);background:var(--busy-bg);border:1px solid var(--busy);border-radius:6px;
  padding:0 7px;font-size:12px;font-weight:700;white-space:nowrap;line-height:19px}

/* ---------- project header and tabs */
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.phead h1{font-size:20px;margin:0}
.phead .right{margin-left:auto}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto;overflow-y:hidden}
.ptab{display:flex;align-items:center;padding:10px 18px;color:var(--muted);font-weight:600;font-size:15px;border-bottom:3px solid transparent;
  white-space:nowrap;text-decoration:none;border-radius:6px 6px 0 0}
.ptab:hover{color:var(--text);background:var(--hover);text-decoration:none}
.ptab.on{color:var(--text);border-bottom-color:var(--accent)}
.ptab .cnt{font-weight:500;font-size:12px;color:var(--muted);margin-left:4px}

/* ---------- project overview */
.concl{font-size:16px;line-height:1.7;margin:0 0 4px;max-width:72em}
.question{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:72em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);text-decoration:none;display:block}
a.stat:hover{border-color:var(--accent);text-decoration:none}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .s{font-size:12px;color:var(--muted);line-height:1.6}
.stat .s b{color:var(--text);font-weight:600}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1000px){.cols2{grid-template-columns:1fr}}
.feed{list-style:none;margin:0;padding:4px 0}
.feed li{display:flex;gap:10px;align-items:baseline;padding:6px 14px;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .when{flex:none;width:5.5em;color:var(--muted);font-size:12px;text-align:right}
.feed a{color:var(--text)}

/* ---------- master / detail */
.md2{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.md2{grid-template-columns:1fr}}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:12px;
  max-height:calc(100vh - 24px);display:flex;flex-direction:column}
@media (max-width:1000px){.list{position:static;max-height:none}}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.chip:hover{text-decoration:none;border-color:var(--accent)}
.chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:600}
.items{overflow-y:auto}
.li{display:block;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover);text-decoration:none}
.li.on{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.li .row1{display:flex;gap:6px;align-items:center;min-width:0}
.li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.li .row2{font-size:12px;color:var(--muted);margin-top:1px;display:flex;gap:6px;flex-wrap:wrap}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px 20px;min-width:0}
.detail>h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dmeta{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px 14px}
.sec{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.sec.first{border-top:0;padding-top:0;margin-top:8px}
.sec>h3{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px;letter-spacing:.02em}
.sec .none{color:var(--muted);font-size:13px}

/* ---------- flow: the branch graph on the left, the selected step on the right */
.flowwrap{display:grid;grid-template-columns:minmax(380px,520px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.flowwrap{grid-template-columns:1fr}}
.flegend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.flegend .sym{margin-right:3px}
.flow{position:relative;min-width:calc(var(--fw) + 220px)}
.flowsvg{position:absolute;left:0;top:0;pointer-events:none}
.frow{display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 calc(var(--fw) + 4px);color:var(--text);text-decoration:none;min-width:0;overflow:hidden}
.frow:hover{background:var(--hover);text-decoration:none}
.frow.on{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.frow .f1{display:flex;gap:6px;align-items:center;white-space:nowrap;min-width:0;font-size:13px;line-height:1.35}
.frow .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600;min-width:0}
.frow .dt{margin-left:auto;padding-left:6px;font-size:11px;color:var(--muted);flex:none}
.frow .st{font-size:11px;color:var(--muted);flex:none}
.frow .f2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.frow.k-version .nm{font-size:14px;color:var(--accent)}
.frow.k-start .nm{color:var(--muted)}
.frow.k-track .nm{font-weight:500}
.tag2{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none}
.frow.k-attempt.s-bad .nm{text-decoration:line-through;text-decoration-color:var(--full);color:var(--muted)}
.frow.k-attempt.s-bad .f2{color:var(--full)}
.frow.k-attempt.s-off .nm,.frow.k-attempt.s-plan .nm{color:var(--muted)}
.frow.k-attempt.s-plan .nm{font-style:italic}
.sym{font-weight:700;flex:none;width:1em;text-align:center}
.sym.s-ok{color:var(--free)} .sym.s-part{color:var(--part)} .sym.s-bad{color:var(--full)} .sym.s-off{color:var(--muted)}
.sym.s-run{color:var(--accent)} .sym.s-todo{color:var(--busy)} .sym.s-plan,.sym.s-other{color:var(--muted)} .sym.version{color:var(--accent)}
.ff{font-size:11px;border-radius:4px;padding:0 5px;flex:none;font-weight:600}
.ff.run{color:var(--accent);background:var(--accent-bg)} .ff.todo{color:var(--busy);background:var(--busy-bg)} .ff.bad{color:var(--full);background:var(--full-bg)}
.fe{fill:none;stroke:var(--muted);stroke-opacity:.45;stroke-width:2}
.fe.main{stroke:var(--accent);stroke-opacity:.55;stroke-width:3}
.fe.after{stroke-dasharray:4 3;stroke-opacity:.6}
.fe.open{stroke-dasharray:3 3}
.fe.hl{stroke:var(--accent);stroke-opacity:1}
.fend{fill:none;stroke:var(--muted);stroke-width:2}
.fend.bad{stroke:var(--full)}
.fg{stroke:var(--card);stroke-width:2}
.fg.start{fill:var(--card);stroke:var(--muted)}
.fg.version{fill:var(--accent)}
.fg.ftrack{fill:var(--card);stroke:var(--muted);stroke-width:1.5}
.fg.a-ok{fill:var(--free)} .fg.a-bad{fill:var(--full)} .fg.a-todo{fill:var(--busy)}
.fg.a-part{fill:var(--card);stroke:var(--part);stroke-width:2}
.fg.a-run{fill:var(--card);stroke:var(--accent);stroke-width:2.5}
.fg.a-off{fill:var(--card);stroke:var(--muted);stroke-dasharray:2 2}
.fg.a-plan{fill:var(--card);stroke:var(--muted);stroke-dasharray:3 2;stroke-width:1.5}
.fg.a-other{fill:var(--card);stroke:var(--muted);stroke-width:1.5}
.fg.on{stroke:var(--accent);stroke-width:3}
.fmark{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fhalf{fill:var(--part)} .fdot{fill:var(--accent)}
.fq{fill:#fff;font-size:10px;font-weight:700;text-anchor:middle}
/* the step on the right */
.oneline{margin:4px 0 6px;padding:8px 12px;border-left:4px solid var(--muted);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px;line-height:1.6}
.oneline.s-ok{border-color:var(--free)} .oneline.s-part{border-color:var(--part)} .oneline.s-bad{border-color:var(--full)}
.oneline.s-run{border-color:var(--accent)} .oneline.s-todo{border-color:var(--busy)}
.kv2{display:grid;grid-template-columns:5em 1fr;gap:8px;margin:2px 0 8px}
.kv2>span{color:var(--muted);font-size:12px;padding-top:3px}
.kv2 .md p:first-child{margin-top:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.vs{grid-template-columns:1fr}}
.vs>div{background:var(--bg);border-radius:8px;padding:8px 12px;min-width:0}
.vsh{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.more2{margin-top:4px}
h3.inl{display:inline;font-size:13px;color:var(--muted)}
details.sec>summary{cursor:pointer}
ul.gists{margin:4px 0;padding-left:18px;font-size:13px}
ul.gists li{margin:3px 0}
a.ref{font-variant-numeric:tabular-nums;font-weight:600;border-bottom:1px dotted var(--accent);text-decoration:none}
.ref.bad{color:var(--full);font-weight:700;cursor:help}

.mflow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:6px 0}
.mbox{display:flex;flex-direction:column;justify-content:center;min-width:110px;max-width:180px;padding:8px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);text-decoration:none;font-size:13px}
a.mbox:hover{border-color:var(--accent);text-decoration:none}
.mbox span{font-size:12px;color:var(--muted)}
.mbox.g0{border-left:4px solid var(--accent)} .mbox.g1{border-left:4px solid var(--busy)} .mbox.g2{border-left:4px solid var(--part)} .mbox.g3{border-left:4px solid var(--free)}
.marr{align-self:center;color:var(--muted);font-size:18px}
.mleg{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mbox.sw{display:inline-block;min-width:0;width:14px;height:10px;padding:0;border-radius:2px}

/* method: levels of boxes, the selected step's path highlighted */
.mcard{padding:6px 0}
.mrow{display:grid;grid-template-columns:9em 1fr;gap:10px;align-items:center;padding:8px 14px}
.mrow+.mrow{border-top:1px dashed var(--line)}
.mlab{font-size:12px;color:var(--muted);font-weight:600}
.mline{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.mline.chips{align-items:center}
.mstep{display:flex;flex-direction:column;gap:2px;min-width:120px;max-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--text);text-decoration:none;font-size:13px}
.mstep:hover{border-color:var(--accent);text-decoration:none}
.mstep.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-bg)}
.mstep .ms1{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mstep .ms2{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin-top:2px}
@media (max-width:700px){.mrow{grid-template-columns:1fr}}
.mstepsof{margin:-4px 0 8px;align-items:center}
.mstep.inloop{border-style:dashed;border-color:var(--accent)}
.mstep.inloop.on{border-style:solid}
.lpn{color:var(--accent);margin:0 3px;font-weight:700}
.mloop{font-size:12px;color:var(--accent);margin-top:6px}

/* documents: marks and where they belong */
.marks{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:2px 0 8px}
.mk{font-size:13px;padding:3px 12px}
.mk.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.figq{font-weight:600;margin:4px 0 8px}
.figbar{display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;margin:0 0 8px;font-size:13px}
.figframe{display:block;width:100%;height:min(80vh,900px);border:1px solid var(--line);border-radius:8px;background:transparent}
.li.old .name{color:var(--muted);text-decoration:line-through}
.li .row1 .pill{flex:none}
ul.doclist{list-style:none;margin:4px 0;padding:0}
ul.doclist li{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:13px;flex-wrap:wrap}
.fdoc{font-size:11px;color:var(--muted);flex:none}
.tgroup a{color:inherit}

/* ---------- roadmap tree, breadcrumbs, steps */
.tree2 .tn{display:flex;align-items:center;gap:6px;padding:6px 12px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--line);min-width:0}
.tree2 .tn:hover{background:var(--hover);text-decoration:none}
.tree2 .tn.on{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.tree2 .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree2 .tv{font-size:14px;background:var(--bg)}
.tree2 .tv .nm{color:var(--muted)}
.tree2 .tt{padding-left:24px;font-weight:600}
.tree2 .tt .cnt{font-size:12px;color:var(--muted);font-weight:400}
.tree2 .ta{padding-left:40px;font-size:13px}
.tree2 .ta .pill{font-size:11px;line-height:18px;padding:0 6px}
.vmark{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.vmark.cur{background:var(--accent);border-color:var(--accent)}
.tgroup{font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px 4px;border-bottom:1px solid var(--line)}
.tflag{font-size:11px;color:var(--busy);font-weight:700}
.crumbs{font-size:13px;margin-bottom:6px}
.steps{list-style:none;margin:0;padding:0;counter-reset:none}
.steps li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.stepn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--track);color:var(--muted);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.auto{margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:8px}
.md2.wide{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1000px){.md2.wide{grid-template-columns:1fr}}
tr[data-href]{cursor:pointer}
pre.plain{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:6px;padding:8px 10px;margin:0;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:340px;overflow:auto}

/* ---------- setup (paper-style) */
.goal{margin:0 0 12px;max-width:72em}
.setgrid{display:grid;grid-template-columns:1fr;gap:16px}
.setblk>h3{font-size:13px;margin:0 0 4px;color:var(--muted)}
table.setup td{white-space:normal;vertical-align:top;overflow-wrap:anywhere}
table.setup code{white-space:normal;overflow-wrap:anywhere}
.kv2{display:grid;grid-template-columns:5.5em 1fr;gap:10px;padding:3px 0;font-size:14px}
.kv2>span{color:var(--muted);font-size:13px}
table.setup td:first-child{white-space:nowrap}
[data-anchor].flash td{animation:flash 2.4s ease-out}
/* ---------- papers (论文): a reading list with a tick per paper */
ul.papers{list-style:none;margin:0;padding:0}
li.paper{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.sec ul.papers li.paper{padding:8px 0}
li.paper.flash{animation:flash 2.4s ease-out}
.pcheck{flex:none;padding-top:2px;cursor:pointer}
.pcheck input{width:18px;height:18px;margin:0;cursor:pointer;accent-color:var(--accent)}
.pbody{flex:1;min-width:0;overflow-wrap:anywhere}
.ptitle{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ptitle a{color:var(--text)}
.pwhy{font-size:13px;margin-top:3px}
.psum{margin-top:3px}
li.paper.read .ptitle,li.paper.read .ptitle a,li.paper.read .pwhy{color:var(--muted);font-weight:normal}
@keyframes flash{0%,40%{background:var(--busy-bg)}100%{background:transparent}}

/* ---------- bars */
.bars{display:grid;gap:3px}
.brow{display:grid;grid-template-columns:minmax(110px,200px) minmax(80px,1fr) auto;gap:10px;align-items:center;padding:2px 6px;border-radius:6px;
  color:var(--text);text-decoration:none;font-size:13px}
a.brow:hover{background:var(--hover);text-decoration:none}
.brow.on{background:var(--accent-bg)}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:12px;background:var(--track);border-radius:3px;overflow:hidden;display:flex}
.bt i{display:block;height:100%;background:var(--bar);border-radius:3px}
.brow.best .bt i{background:var(--free);opacity:1}
.brow.dim .bt i{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.7}
.brow.dim .bl,.brow.dim .bv{color:var(--muted)}
.bv{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:7em}

/* ---------- markdown */
.md{overflow-wrap:anywhere;min-width:0}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p,.md li,.md blockquote{max-width:72em}
.md h3,.md h4,.md h5,.md h6{margin:18px 0 6px;font-size:14px}
.md h3{font-size:15px}
.md p{margin:8px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md ol{padding-left:2.2em}  /* room for two-digit numbers */
.md li{margin:2px 0}
.md li>ul,.md li>ol{margin:2px 0 4px}
.md li>p{margin:4px 0}
.md pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--track);padding:10px 12px;border-radius:6px;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin:10px 0}
.md pre code{background:none;padding:0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px dashed var(--line);margin:16px 0}
table.mdt{border-collapse:collapse;margin:10px 0;font-size:13px}
table.mdt th{background:var(--bg);font-weight:600;text-align:left;border-bottom:2px solid var(--line);padding:5px 12px;white-space:nowrap}
table.mdt td{border-bottom:1px solid var(--line);padding:5px 12px;vertical-align:top}
.num{text-align:right !important;font-variant-numeric:tabular-nums;white-space:nowrap}
table.kv{border-collapse:collapse;font-size:13px;margin:4px 0 10px}
table.kv th{text-align:left;font-weight:500;color:var(--muted);padding:3px 18px 3px 0;vertical-align:top;white-space:nowrap}
table.kv td{padding:3px 0;overflow-wrap:anywhere}
table.mt{border-collapse:collapse;font-size:13px;margin:6px 0}
table.mt th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:2px solid var(--line);padding:5px 12px;white-space:nowrap}
table.mt td{border-bottom:1px solid var(--line);padding:5px 12px;white-space:nowrap}

/* ---------- runs table (interim view until the master/detail step) */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px 0}
.tab{font-size:13px;padding:3px 10px}
.tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.tmeta{padding:8px 14px 4px;font-size:12px;color:var(--muted)}
.dnote{padding:8px 14px 0;font-size:12px;color:var(--busy)}
h3.tt{font-size:14px;margin:0;padding:14px 14px 0;border-top:1px solid var(--line)}
.bare{padding:4px 14px 12px;font-size:13px}
.bare a{margin-right:8px}
table.runs{width:100%;border-collapse:collapse}
table.runs th,table.runs td{padding:7px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.runs th{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
table.runs .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.runs th a{color:inherit;text-decoration:none;display:block}
table.runs th a:hover{color:var(--accent)}
table.runs th.sorted{color:var(--accent);font-weight:600}
table.runs th.num{text-align:right}
table.runs td.rname{min-width:16em;max-width:30em;white-space:normal;overflow-wrap:anywhere}
table.runs td.sv{white-space:nowrap}
table.runs td.sv a{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
table.runs td.sv a:hover{color:var(--accent);border-color:var(--accent)}
table.runs td.mcell{position:relative;min-width:6em}
table.runs td.mcell>i{position:absolute;left:4px;top:7px;height:20px;max-width:calc(100% - 8px);background:var(--accent-bg);border-radius:2px}
table.runs td.mcell>span{position:relative}
table.runs td.mcell.best>span{color:var(--free);font-weight:700}
table.runs td.mcell.spot>i{background:repeating-linear-gradient(45deg,var(--track) 0 3px,transparent 3px 6px)}
table.runs td.mcell.spot>span{color:var(--muted)}
label.rq{display:inline-flex;align-items:center;gap:4px;margin-left:6px}
.wherechips{padding:8px 14px 0;align-items:center}
/* ---------- dataset samples (实验设置, 样例) */
tr.dsamp>td{border-bottom:1px solid var(--line);padding:0 12px 8px}
details.samples>summary{cursor:pointer;font-size:13px;color:var(--accent);padding:4px 0}
.sbar{display:flex;gap:6px;align-items:center;margin:4px 0 6px}
.srec{display:flex;gap:8px;align-items:flex-start;margin:0 0 6px}
.sno{flex:none;width:1.6em;text-align:right;font-size:12px;color:var(--muted);padding-top:6px}
.srec>div{flex:1;min-width:0}
pre.sample{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.45;background:var(--track);padding:6px 10px;border-radius:6px;max-width:100%}
.dsblk{margin:0 0 12px}
.dsblk h3{font-size:14px;margin:6px 0 2px}
/* ---------- cross table (运行 → 交叉表) */
.pvsel{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:12px 14px 4px;font-size:13px;color:var(--muted)}
table.pivot{border-collapse:collapse;margin:8px 14px;font-size:13px}
table.pivot th,table.pivot td{border:1px solid var(--line);padding:6px 10px}
table.pivot th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg);white-space:nowrap}
table.pivot th.pvk{text-align:left;vertical-align:bottom}
table.pivot th.pvh{text-align:left;color:var(--text);max-width:16em;white-space:normal;overflow-wrap:anywhere}
table.pivot td.pv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:5.5em;
  background:color-mix(in srgb,var(--free) calc(var(--g,0) * 40%),transparent)}
table.pivot td.pv.flat{background:color-mix(in srgb,var(--bar) calc(var(--g,0) * 45%),transparent)}
table.pivot td.pv a{color:var(--text);text-decoration:none;display:block}
table.pivot td.pv.best .pvv{font-weight:700}
table.pivot td.pv.spot{background:repeating-linear-gradient(45deg,var(--track) 0 3px,transparent 3px 6px)}
table.pivot td.pv.spot .pvv{color:var(--muted)}
table.pivot td.pv.empty{color:var(--muted);text-align:center}
tr.run{cursor:pointer}
tr.run:hover td{background:var(--bg)}
tr.run.open td{background:var(--accent-bg)}
tr.rdetail>td{background:var(--bg);padding:12px 14px}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-bottom:8px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin:8px 0}
.chart{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chart figcaption{font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--line)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:1.8;vector-effect:non-scaling-stroke}
.chart .pt{fill:var(--accent)}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.imgs img{max-width:320px;max-height:220px;border:1px solid var(--line);border-radius:6px;background:#fff}
pre.json{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:4px 0 10px}
.clip{max-height:60vh;overflow:hidden;position:relative}
.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(rgba(0,0,0,0),var(--card))}
.more{padding:0 14px 12px}

/* ---------- roadmap tree (interim view until the graph step) */
.tree{padding-left:22px}
.ver{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--line)}
.ver:last-child{border-left-color:transparent}
.vdot{position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.ver.cur .vdot{background:var(--accent);border-color:var(--accent)}
.vhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.track{margin:8px 0 0;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:8px}
.track.k-run{border-left-color:var(--accent)} .track.k-ok{border-left-color:var(--free)} .track.k-part{border-left-color:var(--part)}
.track.k-bad,.track.k-off{border-left-color:var(--full);border-left-style:dashed}
.thead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.merge{font-size:12px;color:var(--free);font-weight:600}
.gist{font-size:13px;margin:0 0 4px}
.attl{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.group>h3{font-size:13px;color:var(--muted);font-weight:500;margin:10px 0 4px}

/* ---------- global overview, todo, new project */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--text);text-decoration:none;
  display:flex;flex-direction:column;gap:6px}
.pcard:hover{border-color:var(--accent);text-decoration:none}
.pcard .t{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.pcard .t b{font-size:16px;line-height:1.45}
.pcard .t .pill{margin-top:2px}
.pcard .r{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcard .alerts{display:flex;gap:4px 14px;flex-wrap:wrap}
.pcard .foot{margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
details.ovarch{background:transparent;border:0}
details.ovarch>summary{padding:6px 2px;font-size:13px;color:var(--muted);font-weight:500}
details.ovarch[open]>summary{border-bottom:0;margin-bottom:8px}
.where2{font-size:13px;margin-top:2px;color:var(--muted)}
/* replies */
.ctx{font-size:13px;color:var(--text);background:var(--bg);border-radius:6px;padding:6px 10px;margin:6px 0}
.ctx p{margin:2px 0}
.reply{margin:8px 0 4px;display:flex;flex-direction:column;gap:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:4px 12px;font-size:13px}
.opt.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.opt .rec{font-size:11px;margin-left:6px;padding:0 5px;border-radius:4px;background:var(--free-bg);color:var(--free);font-weight:600}
.opt.on .rec{background:rgba(255,255,255,.25);color:#fff}
.reply textarea{font:inherit;font-size:13px;width:100%;max-width:720px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--text);resize:vertical}
.reply textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.ract{display:flex;gap:10px;align-items:center}
.send{background:var(--accent);border-color:var(--accent);color:var(--card);font-size:13px}
.send:disabled{opacity:.6}
.rerr{color:var(--full);font-size:12px}
.ans{margin:8px 0 4px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 6px 6px 0}
.ans .atext{white-space:pre-wrap}
.res{font-size:13px;color:var(--free)}
.lnkbtn{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 6px}
.lnkbtn:hover{color:var(--accent)}
.rename{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rename input{font:inherit;font-size:18px;font-weight:700;padding:2px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--card);color:var(--text);width:16em}
.fulltitle{margin-top:2px}
.tlist .ttext{line-height:1.65}
.tlist a.more{font-size:13px;white-space:nowrap}
details.done>summary{cursor:pointer;padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
details.done li{color:var(--muted)}
.pcard .c{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .n{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pcard .n b{color:var(--text);font-size:14px}
.pcard .w{font-size:12px;color:var(--busy)}
.tlist{list-style:none;margin:0;padding:0}
.tlist li{padding:10px 14px;border-bottom:1px solid var(--line)}
.tlist li:last-child{border-bottom:0}
h1.pt{font-size:20px;margin:0 0 14px}

.guide h3{font-size:16px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.guide h3:first-child{border-top:0;padding-top:0;margin-top:0}
.guide h4{font-size:14px;margin:14px 0 6px}

/* ---------- GPU page */
.gtop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gtop h1{font-size:20px;margin:0}
.gtop button{margin-left:auto}
.sub{color:var(--muted);font-size:13px}
table.gt{width:100%;border-collapse:collapse;min-width:640px}
table.gt th,table.gt td{padding:8px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.gt tr:last-child td{border-bottom:0}
table.gt th{font-size:12px;font-weight:500;color:var(--muted)}
table.gt td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.free{color:var(--free);background:var(--free-bg)}
.busy{color:var(--busy);background:var(--busy-bg)}
.full{color:var(--full);background:var(--full-bg)}
.bar{height:6px;border-radius:3px;background:var(--track);width:150px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.proc{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.user{font-weight:600;color:var(--accent);white-space:nowrap}
.me{color:var(--free)}
.cmd{color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.err{padding:12px 14px;color:var(--full)}
.err code{font:12px ui-monospace,Menlo,monospace}
.hint{padding:0 14px 12px;color:var(--muted);font-size:12px}
.copy{margin:0;padding:2px 9px;font-size:12px}
.lead{border-color:var(--free)}
.lead>h2{font-size:17px}
.big{font-size:22px;font-variant-numeric:tabular-nums;color:var(--free)}
.slot{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.where{min-width:150px}
.where b{display:block;font-size:15px}
.gchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gchip{display:inline-block;min-width:30px;text-align:center;padding:3px 8px;border-radius:6px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--free);background:var(--free-bg)}
.cmds{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmds code{background:var(--track);padding:3px 8px;border-radius:5px}
details.box{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
details.box>summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:15px}
details.box[open]>summary{border-bottom:1px solid var(--line)}
h3.gh{font-size:13px;color:var(--muted);font-weight:500;margin:22px 2px 8px}
/* card grid: one row per server, one cell per card */
table.ggrid{border-collapse:separate;border-spacing:6px;margin:4px 6px 6px}
table.ggrid th,table.ggrid td{padding:0;vertical-align:middle;text-align:left}
table.ggrid .gsrv{padding:0 10px 0 4px;white-space:nowrap;font-weight:400}
table.ggrid .gsrv a{font-size:15px;font-weight:700;color:var(--text)}
table.ggrid .gfree{padding:0 10px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums}
table.ggrid .gfree b{font-size:18px}
.okc{color:var(--free)}
.gcell{width:108px;border-radius:8px;padding:6px 8px 7px;border:1px solid transparent;font-size:12px;line-height:1.35}
.gcell.free{background:var(--free-bg)} .gcell.busy{background:var(--busy-bg)} .gcell.full{background:var(--full-bg)}
.gcell.off{background:var(--track);opacity:.6}
.gcell.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.gc1{display:flex;justify-content:space-between;color:var(--muted)}
.gc2{margin:1px 0 3px;color:var(--text)} .gc2 b{font-size:17px;font-variant-numeric:tabular-nums}
.gcell.free .gc2 b{color:var(--free)} .gcell.full .gc2 b{color:var(--full)}
.gbar{height:4px;border-radius:2px;background:rgba(127,127,127,.18);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--muted)}
.gcell.busy .gbar i{background:var(--busy)} .gcell.full .gbar i{background:var(--full)}
.gc3{margin-top:3px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc3 .me,.user.me{color:var(--accent)}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block}
a.tag{display:inline-block;margin:0 4px 3px 0;padding:0 7px;border-radius:5px;font-size:12px;font-weight:600;
  color:var(--accent);background:var(--accent-bg);text-decoration:none}
a.tag.warn{color:var(--full);background:var(--full-bg)}

/* ---------- work view (work.js): project head, grouped tabs, 一页纸, kanban, decisions, timeline, sessions */
.hero{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:10px;margin:10px 0 0}
@media (max-width:1100px){.hero{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.hcell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.hk{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.hk a{color:var(--muted)}
.hq{font-size:13.5px;line-height:1.55}
ul.hl{list-style:none;margin:0;padding:0}
ul.hl li{padding:2px 0;line-height:1.5;overflow:hidden;text-overflow:ellipsis}
.pgrp{align-self:center;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;padding:0 4px 0 2px}
.psep{width:1px;background:var(--line);margin:8px 10px;flex:none}
.ptab.quiet{font-weight:500}
.onepager{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;background:var(--bg);margin:6px 0 10px;padding:4px 0}
.oprow{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;padding:5px 12px;border-bottom:1px dashed var(--line)}
.oprow:last-child{border-bottom:0}
.opk{font-size:12px;font-weight:700;color:var(--muted);padding-top:2px}
.op-所以 .opk,.op-结果 .opk{color:var(--accent)}
.op-所以 .opv{font-weight:600}
.opx{margin-top:4px;font-weight:400}
.opmiss{font-size:12px;color:var(--muted);margin:0 0 8px}
.opblk+.opblk{margin-top:14px}
.opt2{margin-bottom:2px}
abbr.term{text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:help}
.homegrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.homegrid{grid-template-columns:1fr}}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow-x:auto;margin-bottom:12px}
.kcol{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:80px}
.kh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;color:var(--text);text-decoration:none}
.tcard:hover{border-color:var(--accent);text-decoration:none}
.tcard.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tc1{display:flex;gap:6px;align-items:baseline}
.kdone .li{display:flex;gap:8px;align-items:center}
.taskd .kv2{margin:3px 0}
ul.tline{list-style:none;margin:0;padding:0}
ul.tline li{display:flex;gap:8px;align-items:baseline;padding:4px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
ul.tline li.day{font-weight:700;color:var(--muted);font-size:12px;border-bottom:0;padding-top:12px}
ul.tline li.new{background:var(--accent-bg)}
ul.tline .when{flex:none;width:3.2em;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
ul.tline a{color:var(--text)}
ul.plain{margin:0;padding-left:18px}
table.sess td{vertical-align:top}
table.sess tr.ctxbig td{background:var(--busy-bg)}
table.sess tr.ended td{opacity:.5}
label.direct{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;margin-left:10px;cursor:pointer}
li.sub{font-size:12px;font-weight:700;color:var(--muted);padding:8px 14px 2px;border-bottom:0 !important;list-style:none}
li.arow .ans{margin-top:3px}
.filters2{margin:0 0 6px}
ul.inbox{list-style:none;margin:0;padding:0}
/* ---------- 设计思路 (design.js) */
.dz-head{margin-bottom:12px}
.dz-sub{color:var(--muted);font-size:15px;margin:-4px 0 8px}
.dz-act{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dz-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.dz-body{grid-template-columns:1fr}}
.dz-toc{position:sticky;top:12px;display:flex;flex-direction:column;gap:1px;font-size:13px;max-height:calc(100vh - 24px);overflow-y:auto}
@media (max-width:900px){.dz-toc{position:static;max-height:none}}
.dz-toc a{color:var(--text);padding:4px 8px;border-radius:6px;display:flex;gap:6px}
.dz-toc a:hover{background:var(--hover);text-decoration:none}
.dz-toc a span{color:var(--muted);width:1.4em;text-align:right;flex:none}
.dz-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:14px;scroll-margin-top:12px}
.dz-sec h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.dz-n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;flex:none}
.dz-sec p{margin:8px 0;line-height:1.75}
.dz-lead{font-size:15px}
.dz-ol,.dz-ul{margin:6px 0;padding-left:22px;line-height:1.75}
.dz-ol li,.dz-ul li{margin:4px 0}
table.dz-t{margin:8px 0}
table.dz-t td{white-space:normal;vertical-align:top;line-height:1.6}
table.dz-t th{white-space:nowrap}
.dz-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0}
@media (max-width:900px){.dz-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dz-stats .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dz-svg{width:100%;height:auto;display:block;margin:6px 0 10px}
.dz-svg .dg rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.dz-svg .dg.you rect{stroke:var(--text)}
.dz-svg .dg.core rect{fill:var(--accent-bg);stroke:var(--accent)}
.dz-svg .dg.agent rect{fill:var(--free-bg);stroke:var(--free)}
.dz-svg .dg.prog rect{fill:var(--part-bg);stroke:var(--part)}
.dz-svg .dg.disk rect{fill:var(--track);stroke:var(--muted)}
.dz-svg .dg.gpu rect{fill:var(--busy-bg);stroke:var(--busy)}
.dz-svg .dg.zone rect{fill:none;stroke:var(--muted);stroke-dasharray:6 5}
.dz-svg .dt{fill:var(--text);font-size:14px;font-weight:700}
.dz-svg .dt.c{text-anchor:middle;font-size:13px}
.dz-svg .dl{fill:var(--muted);font-size:12.5px}
.dz-svg .dgt{fill:var(--text);font-size:14px;font-weight:700}
.dz-svg .da{stroke:var(--muted);stroke-width:1.6;fill:none}
.dz-svg .da.dash{stroke-dasharray:5 4}
.dz-svg .dam{fill:var(--muted)}
.dz-svg .dal{fill:var(--accent);font-size:12px}
ul.inbox li{display:flex;gap:8px;align-items:baseline;padding:7px 14px;border-bottom:1px solid var(--line)}
ul.inbox li:last-child{border-bottom:0}
ul.inbox .ip{flex:none;font-size:12px;color:var(--muted);width:8.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.inbox .it{flex:1;min-width:0}
ul.inbox .ig{flex:none;font-size:12px}
table.sess .bar{width:90px}
table.sess .bar i{background:var(--bar)}
.taskd .kv2{grid-template-columns:6.5em 1fr}
.q2{font-size:13px}
</style>
</head>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="page" id="main">加载中…</div></main>
</div>
<script src="common.js"></script>
<script src="work.js"></script>
<script src="design.js"></script>
<script src="home.js"></script>
<script src="app.js"></script>
